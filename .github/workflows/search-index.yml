name: Search index

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build search index
        run: npm run build:index

      - name: Fail PR if index is stale
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- search-index.json; then
            echo "search-index.json is stale. Run npm run build:index and commit the result."
            git diff -- search-index.json
            exit 1
          fi

      - name: Commit updated index on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- search-index.json; then
            echo "search-index.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search-index.json
          git commit -m "chore: regenerate search-index.json"
          git push
